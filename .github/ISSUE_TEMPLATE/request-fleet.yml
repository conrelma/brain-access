name: Join Agent Brain
description: Ask for access to Agent Brain (formerly the Agent Fleet notes): running AI assistants at home.
title: "Access request: fleet"
labels: ["access-request"]
body:
  - type: markdown
    attributes:
      value: |
        This asks for Agent Brain (formerly the Agent Fleet notes): running AI assistants at home, plus a Start here track for setting up your own assistant.

        This page is public and your request stays visible. Write only your first name. Write nothing private. GitHub keeps the edit history of a public issue, so editing it later does not hide anything.

        **Your email address (needed):** do not write it here. Give it privately on [this short form](https://robust-saddle-2x4e.here.now/). It goes only to the owner and is used to send you the Brain newsletter.
  - type: input
    id: name
    attributes:
      label: Your first name (so the owner knows who you are)
    validations:
      required: true
  - type: input
    id: assistant
    attributes:
      label: Which AI assistant do you use? (for example Claude Code, Codex, Hermes or Cursor)
    validations:
      required: false
