# When a Brain is added, add its line here and its short name to the BRAINS secret (Brain Kit Recipe 1).
# Each line starts with the short name and a colon; the selftest in .github/scripts/access.py checks it.
name: Request access
description: Ask for access to one or more Brains.
title: "Access request"
labels: ["access-request"]
body:
  - type: markdown
    attributes:
      value: |
        This page is public and your request stays visible. Write only your first name. Write nothing private: no personal or company details. GitHub keeps the edit history of a public issue, so editing it later does not hide anything.
  - type: checkboxes
    id: brains
    attributes:
      label: Which Brains do you think you need?
      description: The owner decides which Brains you get. Tick what fits your work; the owner may give you more or fewer.
      options:
        - label: "finance: company finance recipes (X3 connection, statements, cash flow, dashboards)"
        - label: "fleet: running AI assistants at home, plus a Start here track for setting up your own assistant (personal Brain)"
        - label: "yield: revenue management recipes (competitor fare tracking, yield and load factor methods)"
        - label: "data: company data sources (lakehouse, FlightAware, adsb.lol, QlikView, airport statistics, Reporting Data; how to connect, what is there, which source wins, reconciliation)"
        - label: "general: how the company makes things (brand, documents and decks, meetings and polls, Microsoft 365 and Asana with an assistant, IT and Innovation, company laptop setup)"
  - type: input
    id: name
    attributes:
      label: Your first name (so the owner knows who you are)
    validations:
      required: true
