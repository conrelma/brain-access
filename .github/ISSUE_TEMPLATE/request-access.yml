name: Request access
description: Ask for access to one or more Brains.
title: "Access request"
labels: ["access-request"]
body:
  - type: markdown
    attributes:
      value: |
        This page is public and your request stays visible. Write only your first name. Write nothing private: no personal or company details. GitHub keeps the edit history of a public issue, so editing it later does not hide anything.
  - type: checkboxes
    id: brains
    attributes:
      label: Which Brains do you need?
      options:
        - label: finance
        - label: fleet
  - type: input
    id: name
    attributes:
      label: Your first name (so the owner knows who you are)
    validations:
      required: true
