name: access

# Access requests for the Brains. Only the owner's commands act: checked here by account id
# (6285991) and association, and again in the script. The script also acts only on an open issue
# with the access-request label, or an open issue the owner opened. Request text never reaches a
# shell: it is passed through environment variables only. No pull_request trigger, so forks never
# see secrets.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  acknowledge:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - run: gh issue comment "$ISSUE" -R "$REPO" --body "Thank you. The owner has been notified and will reply here."
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}

  command:
    if: >-
      github.event_name == 'issue_comment'
      && !github.event.issue.pull_request
      && github.event.comment.user.id == 6285991
      && github.event.comment.author_association == 'OWNER'
    concurrency:
      group: access-${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 .github/scripts/access.py --selftest
      - run: python3 .github/scripts/access.py command
        env:
          GH_TOKEN: ${{ github.token }}
          ADMIN_TOKEN: ${{ secrets.BRAIN_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_AUTHOR_ID: ${{ github.event.issue.user.id }}
          ISSUE_AUTHOR_TYPE: ${{ github.event.issue.user.type }}
          COMMENT_AUTHOR_ID: ${{ github.event.comment.user.id }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          BODY: ${{ github.event.comment.body }}
          BRAINS: ${{ secrets.BRAINS }}
